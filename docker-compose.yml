# =============================================================================
#  Iceberg Lab — Airflow + Spark + Iceberg + MinIO (S3) + REST catalog
# -----------------------------------------------------------------------------
#  Data flow:  Airflow (DockerOperator) --> spark-submit --> Iceberg tables
#              stored as Parquet in MinIO, tracked by the Iceberg REST catalog.
#
#  UIs after `docker compose up`:
#    Airflow    http://localhost:8080   (login: airflow / airflow)
#    Spark/Jupyter notebook  http://localhost:8888
#    Spark UI   http://localhost:4040   (only while a job runs)
#    MinIO console  http://localhost:9001 (login: admin / password)
#
#  First run:
#    1. cp .env.example .env   (and set DOCKER_GID on Linux — see .env.example)
#    2. docker compose up airflow-init
#    3. docker compose up -d
#    4. Open Airflow, unpause & trigger the `spark_iceberg_etl` DAG.
# =============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.4-python3.12
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    # The DockerOperator needs the docker provider (installed at container start).
    _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-docker==3.14.1"
    # ${PWD} resolves to THIS directory on the host — the DAG uses it to bind-mount
    # ./spark/scripts into the short-lived Spark container the DockerOperator spawns.
    HOST_PROJECT_PATH: ${PWD}
    # Credentials the spawned Spark container uses to talk to MinIO.
    AWS_ACCESS_KEY_ID: admin
    AWS_SECRET_ACCESS_KEY: password
    AWS_REGION: us-east-1
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    # Let Airflow drive the host Docker daemon (that's how it launches Spark jobs).
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  # Grant access to the docker socket's group (set DOCKER_GID in .env on Linux).
  group_add:
    - "${DOCKER_GID:-999}"
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  # Storage: MinIO is an S3-compatible object store; the "warehouse" bucket
  # holds the actual Iceberg data + metadata files.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot init: create the "warehouse" bucket MinIO/Iceberg will use.
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin password &&
      mc mb --ignore-existing local/warehouse &&
      echo 'Bucket warehouse ready';
      "

  # ---------------------------------------------------------------------------
  # Iceberg REST catalog: the source of truth for table metadata locations.
  # Both Spark (interactive) and the Airflow-launched Spark jobs point at it.
  # ---------------------------------------------------------------------------
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    depends_on:
      minio-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Interactive Spark + Iceberg + Jupyter (optional, but great for poking around
  # the same tables Airflow writes). Preconfigured with a catalog named `demo`.
  # ---------------------------------------------------------------------------
  spark-iceberg:
    image: tabulario/spark-iceberg:latest
    container_name: spark-iceberg
    depends_on:
      iceberg-rest:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8888:8888"   # Jupyter
      - "4040:4040"   # Spark UI (during a job)
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    volumes:
      - ./spark/scripts:/opt/scripts
      - spark-warehouse:/home/iceberg/warehouse
      - spark-notebooks:/home/iceberg/notebooks

  # ---------------------------------------------------------------------------
  # Airflow: metadata DB + init + webserver + scheduler.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname Air --lastname Flow \
          --role Admin --email airflow@example.com || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  minio-data:
  postgres-db:
  spark-warehouse:
  spark-notebooks:

# Fixed network name so the DAG's DockerOperator can attach spawned Spark
# containers to the same network (they must reach iceberg-rest & minio by name).
networks:
  default:
    name: iceberg_lab_net
